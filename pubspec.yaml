name: delivery_app
description: App de delivery construida con Flutter, Riverpod y Supabase.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend / Auth
  supabase_flutter: ^2.5.6

  # Manejo de estado
  flutter_riverpod: ^2.5.1

  # UI
  cupertino_icons: ^1.0.6
  flutter_stripe: ^14.2.0
  file_picker: ^10.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true